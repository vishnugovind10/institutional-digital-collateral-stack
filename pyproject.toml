[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "institutional-digital-collateral-stack"
version = "0.1.0"
description = "Reference architecture for 24/7 institutional digital collateral coordination."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Vishnu Govind" }]
keywords = [
  "digital-collateral",
  "tokenization",
  "settlement",
  "dvp",
  "liquidity-risk",
  "reconciliation",
  "financial-infrastructure",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[project.scripts]
digital-collateral-demo = "digital_collateral.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/digital_collateral"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
